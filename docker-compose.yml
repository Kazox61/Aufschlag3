# Local dev database. Server dev defaults (AppConfig.fromEnv) match these values.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aufschlag
      POSTGRES_USER: aufschlag
      POSTGRES_PASSWORD: aufschlag
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aufschlag -d aufschlag"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
